<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; font-family: sans-serif; }
  .grid { display: flex; height: 100vh; }
  .sidebar { width: 300px; background: #111; overflow-y: auto; padding: 10px; }
  .channel { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; }
  .channel.active { background: #333; }
  .main { flex: 1; background: #000; }
  iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sidebar">
      <h3>TV Guide</h3>
      <div class="channel active" onclick="loadStream()">ESPN HD 24/7</div>
      <div class="channel" onclick="loadStream()">ABC Network</div>
    </div>
    <div class="main">
      <iframe id="player" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>
  <script>
    function loadStream() {
      var iframe = document.getElementById('player');
      iframe.src = '/api/bintv-proxy?id=aHR0cHM6Ly9laGdlbWJ4ZS5jZmQvYmludHYvc3BkOGdwb2gtNjU4Ng';
    }
  </script>
</body>
</html>
